# Написано ИИ на данных с диаграмм

openapi: 3.0.0

info:
  title: Smart Home Microservices API
  description: API для управления умным домом (3 микросервиса)
  version: 1.0.0
  contact:
    name: Smart Home Team
    email: support@smarthome.com

servers:
  - url: http://localhost:8001
    description: User Service
  - url: http://localhost:8002
    description: Device Service
  - url: http://localhost:8003
    description: Metrics Service

tags:
  - name: User Service
    description: Управление пользователями и аутентификация
  - name: Device Service
    description: Самообслуживание — управление устройствами
  - name: Metrics Service
    description: Сбор и хранение показателей

# ============================================
# 1. USER SERVICE
# ============================================
paths:
  /auth/register:
    post:
      tags:
        - User Service
      summary: Регистрация нового пользователя
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - name
              properties:
                email:
                  type: string
                  format: email
                  example: "user@example.com"
                  description: Email пользователя
                password:
                  type: string
                  minLength: 6
                  example: "secure123"
                  description: Пароль (минимум 6 символов)
                name:
                  type: string
                  example: "John Doe"
                  description: Полное имя
                phone:
                  type: string
                  example: "+1234567890"
                  description: Номер телефона (опционально)
      responses:
        '201':
          description: Пользователь успешно зарегистрирован
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: "usr-12345678"
                  email:
                    type: string
                    example: "user@example.com"
                  name:
                    type: string
                    example: "John Doe"
                  role:
                    type: string
                    example: "user"
                  created_at:
                    type: string
                    format: date-time
        '400':
          description: Неверные данные
        '409':
          description: Пользователь уже существует

  /auth/login:
    post:
      tags:
        - User Service
      summary: Вход в систему
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: "user@example.com"
                password:
                  type: string
                  example: "secure123"
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIs..."
                    description: JWT токен для авторизации
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                      name:
                        type: string
                      role:
                        type: string
        '401':
          description: Неверные учетные данные

  /auth/validate:
    get:
      tags:
        - User Service
      summary: Проверка JWT токена
      operationId: validateToken
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            example: "Bearer eyJhbGciOiJIUzI1NiIs..."
          description: Bearer токен
      responses:
        '200':
          description: Токен валиден
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                    example: true
                  user_id:
                    type: string
                    example: "usr-12345678"
                  email:
                    type: string
                    example: "user@example.com"
        '401':
          description: Невалидный токен

  /users/{user_id}:
    get:
      tags:
        - User Service
      summary: Получить информацию о пользователе
      operationId: getUser
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
          description: ID пользователя
      responses:
        '200':
          description: Информация о пользователе
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  email:
                    type: string
                  name:
                    type: string
                  role:
                    type: string
                  created_at:
                    type: string
                    format: date-time
        '404':
          description: Пользователь не найден

# ============================================
# 2. DEVICE SERVICE ⭐ (САМООБСЛУЖИВАНИЕ)
# ============================================
  /devices/register:
    post:
      tags:
        - Device Service
      summary: ⭐ Самостоятельная регистрация устройства
      operationId: registerDevice
      description: |
        **⭐ SELF-SERVICE FEATURE**
        
        Пользователь может САМ зарегистрировать устройство.
        **БЕЗ ВЫЕЗДА СПЕЦИАЛИСТА!**
        
        Устройство автоматически становится активным.
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            example: "Bearer eyJhbGciOiJIUzI1NiIs..."
          description: Bearer токен (проверка пользователя)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - type
                - location
              properties:
                name:
                  type: string
                  example: "Living Room Sensor"
                  description: Название устройства
                type:
                  type: string
                  enum: [temperature_sensor, light, smart_lock, camera, gate]
                  example: "temperature_sensor"
                  description: Тип устройства
                location:
                  type: string
                  example: "Living Room"
                  description: Местоположение
                model:
                  type: string
                  example: "DHT22"
                  description: Модель устройства (опционально)
      responses:
        '201':
          description: Устройство успешно зарегистрировано
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: "dev-12345678"
                  name:
                    type: string
                    example: "Living Room Sensor"
                  type:
                    type: string
                    example: "temperature_sensor"
                  location:
                    type: string
                    example: "Living Room"
                  status:
                    type: string
                    example: "active"
                  is_online:
                    type: boolean
                    example: true
                  user_id:
                    type: string
                    example: "usr-12345678"
                  registered_at:
                    type: string
                    format: date-time
        '400':
          description: Неверные данные
        '401':
          description: Неавторизован

  /devices:
    get:
      tags:
        - Device Service
      summary: Получить список всех устройств
      operationId: getDevices
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            example: "Bearer eyJhbGciOiJIUzI1NiIs..."
      responses:
        '200':
          description: Список устройств
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    type:
                      type: string
                    location:
                      type: string
                    status:
                      type: string
                    is_online:
                      type: boolean

  /devices/{device_id}:
    get:
      tags:
        - Device Service
      summary: Получить устройство по ID
      operationId: getDevice
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Информация об устройстве
        '404':
          description: Устройство не найдено

    put:
      tags:
        - Device Service
      summary: Обновить устройство
      operationId: updateDevice
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                location:
                  type: string
                status:
                  type: string
                  enum: [active, inactive]
      responses:
        '200':
          description: Устройство обновлено
        '404':
          description: Устройство не найдено

    delete:
      tags:
        - Device Service
      summary: Удалить устройство
      operationId: deleteDevice
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Устройство удалено
        '404':
          description: Устройство не найдено

# ============================================
# 3. METRICS SERVICE
# ============================================
  /metrics:
    post:
      tags:
        - Metrics Service
      summary: Сохранить показание с датчика
      operationId: saveMetric
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - device_id
                - metric_type
                - value
              properties:
                device_id:
                  type: string
                  example: "dev-12345678"
                  description: ID устройства
                sensor_id:
                  type: string
                  example: "sensor-001"
                  description: ID датчика (опционально)
                metric_type:
                  type: string
                  enum: [temperature, humidity, pressure, energy]
                  example: "temperature"
                  description: Тип показателя
                value:
                  type: number
                  format: float
                  example: 24.5
                  description: Значение
                unit:
                  type: string
                  example: "Celsius"
                  description: Единица измерения
      responses:
        '201':
          description: Показание сохранено
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  device_id:
                    type: string
                  sensor_id:
                    type: string
                  metric_type:
                    type: string
                  value:
                    type: number
                  unit:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: Неверные данные

  /metrics/latest/{device_id}:
    get:
      tags:
        - Metrics Service
      summary: Получить последнее показание устройства
      operationId: getLatestMetric
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
          description: ID устройства
      responses:
        '200':
          description: Последнее показание
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  device_id:
                    type: string
                  metric_type:
                    type: string
                  value:
                    type: number
                  unit:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
        '404':
          description: Показания не найдены

  /metrics/history/{device_id}:
    get:
      tags:
        - Metrics Service
      summary: Получить историю показаний
      operationId: getMetricsHistory
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
          description: ID устройства
        - name: from_date
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Начало периода
        - name: to_date
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Конец периода
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
          description: Максимальное количество записей
      responses:
        '200':
          description: История показаний
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    device_id:
                      type: string
                    metric_type:
                      type: string
                    value:
                      type: number
                    unit:
                      type: string
                    timestamp:
                      type: string
                      format: date-time

  /metrics/weather:
    get:
      tags:
        - Metrics Service
      summary: Получить погоду из внешнего API
      operationId: getWeather
      parameters:
        - name: location
          in: query
          required: true
          schema:
            type: string
            example: "Moscow"
          description: Название города
      responses:
        '200':
          description: Данные о погоде
          content:
            application/json:
              schema:
                type: object
                properties:
                  location:
                    type: string
                  temperature:
                    type: number
                  humidity:
                    type: number
                  conditions:
                    type: string
                  fetched_at:
                    type: string
                    format: date-time
        '400':
          description: Location обязателен

# ============================================
# COMPONENTS (общие схемы)
# ============================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []
